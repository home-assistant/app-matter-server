---
configuration:
  log_level:
    name: Ниво евиденције Matter Servera
    description: Ниво бележења догађаја компоненте Matter Server.
  beta:
    name: Користи најновију бета верзију
    description: >-
      Инсталира најновију бета верзију Matter Servera (засновану на matter.js) са npm-а
      преко уграђене верзије. Препоручује се да направите резервну копију (backup)
      пре покретања апликације са укљученом овом опцијом!
  enable_test_net_dcl:
    name: Омогући коришћење test-net DCL-а.
    description: >-
      Омогућава PAA коренске сертификате, ажурирања софтвера и друге информације о
      уређајима са test-net DCL-а. Намењено је искључиво за развој и
      тестирање.
  time_sync:
    name: Синхронизација времена
    description: >-
      Одређује да ли Matter Server шаље тренутно време Matter уређајима.
      "auto" (подразумевано) укључује ову опцију само када је сат хоста NTP
      синхронизован; "on" је увек укључује (упозорење се бележи у евиденцију ако сат
      хоста није NTP синхронизован, јер је време послато уређајима тачно колико и
      сат хоста); "off" је искључује.
  default_fabric_label:
    name: Подразумевана ознака мреже
    description: >-
      Фиксира ознаку мреже (приказује се на Matter уређајима за овај контролер, макс.
      32 знака) на ову вредност. Подразумевано се користи назив дома из Home Assistant-а.
      Ово је корисно ако се Matter Server користи из више Home Assistant инстанци,
      које би иначе свака слала свој назив дома као ознаку. Када је подешено,
      промена ознаке путем WebSocket API-ја је
      блокирана.
  bluetooth_adapter_id:
    name: ID Bluetooth адаптера (застарело)
    description: >-
      ЗАСТАРЕЛО: Уместо овога користите опцију „Омогући BLE прокси“, која омогућава Home
      Assistant-у да управља BLE повезивањем преко сопственог Bluetooth стека
      (укључујући ESPHome BLE проксије). Ова опција за сада још увек ради.
      ID BlueZ Bluetooth контролера који користи Matter Server. Ово је
      неопходно ако се користи локално повезивање путем Bluetooth-а. Напомена: Препоручује
      се повезивање путем апликације Home Assistant Companion јер је
      боље тестирано и омогућава повезивање непосредно поред
      самог уређаја.
  ble_proxy:
    name: Омогући BLE прокси
    description: >-
      Излаже крајњу тачку BLE проксија Matter Servera како би Home Assistant
      Matter интеграција могла да управља BLE повезивањем преко сопственог
      Bluetooth стека (укључујући ESPHome BLE проксије). За коришћење BLE проксија
      потребан је Home Assistant 2026.06 или новији (где је додата подршка за
      прокси у Matter интеграцији). Међусобно се искључује са опцијом
      „ID Bluetooth адаптера“ — опција локалног адаптера се занемарује уз
      упозорење када је ово укључено.
  matter_server_env_vars:
    name: Променљиве окружења за Matter Server
    description: >-
      Додатне променљиве окружења које се извозе пре покретања Matter Servera.
      Унесите по једну ставку на листи у формату „КЉУЧ=ВРЕДНОСТ“.
  matter_server_args:
    name: Додатни аргументи за Matter Server
    description: >-
      Омогућава прослеђивање додатних аргумената командне линије Matter
      Serveru. Користите „--help“ за листу могућих аргумената. Имајте на уму да
      аргументе додаје и скрипта за покретање којом управљају друге
      опције апликације.
  matter_server_version:
    name: Верзија Matter Servera
    description: >-
      Инсталира одређену верзију пакета „matter-server“ са npm-а (има предност у односу на
      Бета опцију). Вредности са главном верзијом >= 3 се занемарују као заостале
      Python Matter Server верзије; осим ако није укључена Бета опција, користи се
      уграђена верзија. УПОЗОРЕЊЕ:
      Старија верзија може имати некомпатибилан формат складиштења података! Користите
      ову функciju опрезно! Обавезно направите свежу резервну копију апликације!
network:
  5580/tcp: Порт WebSocket сервера за Matter Server.
